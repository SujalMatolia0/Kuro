appId: com.kuro.app
productName: Kuro
copyright: Copyright © 2026 Kuro

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools

publish:
  provider: github
  owner: SujalMatolia0
  repo: Dev-Companion

asar: true
